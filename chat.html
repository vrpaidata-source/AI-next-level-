
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRPAIData AI Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#050b18;color:white;font-family:Arial,sans-serif;
  min-height:100vh;display:flex;overflow:hidden
}
.sidebar{
  width:260px;background:#091529;border-right:1px solid #1b2d48;
  padding:22px;display:flex;flex-direction:column
}
.logo{font-size:22px;font-weight:bold;margin-bottom:30px}
.logo span{color:#28aaff}
.newchat{
  padding:13px;border:1px solid #24517a;border-radius:10px;
  background:#102440;color:white;cursor:pointer
}
.sidebar p{color:#7890ae;font-size:12px;margin-top:30px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{
  padding:20px 25px;border-bottom:1px solid #1b2d48;
  font-weight:bold
}
.topbar span{color:#31b9ff}
.messages{
  flex:1;overflow-y:auto;padding:35px 20px;
  display:flex;flex-direction:column;gap:22px
}
.welcome{text-align:center;margin:auto;max-width:600px}
.welcome h1{font-size:36px;margin-bottom:15px}
.gradient{
  background:linear-gradient(90deg,#278cff,#00e1ff);
  -webkit-background-clip:text;color:transparent
}
.welcome p{color:#91a5c0;line-height:1.7}
.message{
  max-width:750px;width:100%;margin:0 auto;
  padding:16px 19px;border-radius:13px;
  background:#10213a;line-height:1.6;
  overflow-wrap:anywhere
}
.message.user{background:#12345a}
.sender{font-size:12px;color:#45baff;margin-bottom:8px}
.composer{
  padding:18px 20px 25px;max-width:850px;width:100%;
  margin:0 auto
}
.inputbox{
  display:flex;gap:10px;padding:10px;
  background:#10213a;border:1px solid #28517b;
  border-radius:15px
}
input{
  flex:1;min-width:0;background:transparent;
  border:0;outline:0;color:white;font-size:16px;padding:10px
}
button.send{
  background:linear-gradient(90deg,#087cff,#00c8ff);
  color:white;border:0;border-radius:10px;
  padding:0 20px;font-size:20px;cursor:pointer
}
.note{text-align:center;color:#7186a2;font-size:11px;margin-top:12px}
@media(max-width:650px){
  .sidebar{width:65px;padding:12px}
  .logo{font-size:12px;overflow:hidden}
  .newchat{font-size:0;padding:12px}
  .newchat:after{content:"+";font-size:22px}
  .sidebar p{display:none}
  .topbar{padding:18px}
  .welcome h1{font-size:28px}
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo">VRPAIData <span>AI</span></div>
  <button class="newchat" onclick="newChat()">＋ New Chat</button>
  <p>YOUR AI WORKSPACE</p>
</aside>

<main class="main">
  <div class="topbar">✦ VRPAIData <span>AI Assistant</span></div>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <h1>Hello! <span class="gradient">Welcome.</span></h1>
      <p>Your intelligent AI workspace starts here.
      Ask a question and explore new possibilities.</p>
    </div>
  </div>

  <div class="composer">
    <form class="inputbox" id="chatForm">
      <input id="userInput" type="text"
        placeholder="Message VRPAIData AI..." autocomplete="off">
      <button class="send" type="submit">➤</button>
    </form>
    <div class="note">VRPAIData AI · AI responses will be connected soon</div>
  </div>
</main>

<script>
const form=document.getElementById("chatForm");
const input=document.getElementById("userInput");
const messages=document.getElementById("messages");

function addMessage(text,type){
  const welcome=document.getElementById("welcome");
  if(welcome) welcome.remove();

  const box=document.createElement("div");
  box.className="message "+type;

  const sender=document.createElement("div");
  sender.className="sender";
  sender.textContent=type==="user"?"YOU":"VRPAIDATA AI";

  const content=document.createElement("div");
  content.textContent=text;

  box.append(sender,content);
  messages.appendChild(box);
  messages.scrollTop=messages.scrollHeight;
}

form.addEventListener("submit",function(e){
  e.preventDefault();
  const text=input.value.trim();
  if(!text)return;

  addMessage(text,"user");
  input.value="";

  setTimeout(()=>{
    addMessage(
      "Thanks for your message! The AI model connection is coming soon.",
      "assistant"
    );
  },500);
});

function newChat(){
  messages.innerHTML=
    '<div class="welcome" id="welcome"><h1>Hello! <span class="gradient">Welcome.</span></h1><p>Your intelligent AI workspace starts here. Ask a question and explore new possibilities.</p></div>';
}
</script>
</body>
</html>
