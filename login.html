
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VRPAIData AI | Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;display:grid;place-items:center;
  background:#050b18;color:white;font-family:Arial,sans-serif;
  padding:20px;
}
body:before{
  content:"";position:fixed;width:350px;height:350px;
  background:#006cff;filter:blur(160px);opacity:.2;
  top:-100px;left:-100px;z-index:-1;
}
.container{
  width:100%;max-width:440px;padding:35px;
  background:rgba(15,31,54,.92);
  border:1px solid #23466c;border-radius:22px;
  box-shadow:0 20px 70px rgba(0,0,0,.4);
}
.logo{text-align:center;font-size:27px;font-weight:bold;margin-bottom:12px}
.logo span{color:#24baff}
.subtitle{text-align:center;color:#91a5c0;margin-bottom:30px}
.tabs{display:flex;gap:10px;margin-bottom:25px}
.tabs button{
  flex:1;padding:13px;border-radius:9px;
  border:1px solid #284968;background:transparent;
  color:#a9bfd9;cursor:pointer;
}
.tabs button.active{
  background:linear-gradient(90deg,#087cff,#00c8ff);
  color:white;border:0;
}
label{display:block;font-size:13px;color:#b9cce1;margin-bottom:8px}
input{
  width:100%;padding:14px;margin-bottom:18px;
  background:#081629;border:1px solid #294967;
  border-radius:9px;color:white;outline:none;font-size:15px;
}
input:focus{border-color:#20aaff}
.submit{
  width:100%;padding:15px;border:0;border-radius:10px;
  background:linear-gradient(90deg,#087cff,#00c8ff);
  color:white;font-size:16px;font-weight:bold;cursor:pointer;
}
.submit:disabled{opacity:.5}
.forgot{
  display:block;text-align:right;color:#42c3ff;
  font-size:13px;margin:-5px 0 20px;cursor:pointer;
}
.message{
  display:none;padding:12px;margin-bottom:18px;
  border-radius:9px;font-size:13px;line-height:1.5;
  background:#152c46;color:#b9eaff;
  overflow-wrap:anywhere;
}
.message.error{color:#ffb4b4;background:#3b2029}
.footer{text-align:center;color:#7289a6;font-size:12px;margin-top:25px}
.hidden{display:none}
</style>
</head>

<body>

<div class="container">

  <div class="logo">VRPAIData <span>AI</span></div>
  <p class="subtitle">Your intelligent AI workspace</p>

  <div class="tabs">
    <button id="loginTab" class="active" type="button">Login</button>
    <button id="registerTab" type="button">Register</button>
  </div>

  <div id="message" class="message"></div>

  <form id="authForm">

    <div id="nameField" class="hidden">
      <label>Full Name</label>
      <input id="fullName" type="text" placeholder="Your name">
    </div>

    <label>Email Address</label>
    <input id="email" type="email" placeholder="Enter your email" required>

    <label>Password</label>
    <input id="password" type="password"
      placeholder="Enter password" minlength="8" required>

    <div id="forgot" class="forgot">Forgot Password?</div>

    <button id="submitBtn" class="submit" type="submit">
      Login to VRPAIData AI
    </button>

  </form>

  <div class="footer">
    Secure Authentication · VRPAIData AI
  </div>

</div>

<script>
const SUPABASE_URL =
  "https://kuqjjkpeqpwfoczhjaui.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_vbF6X0SozXJtBqXhzg4Idw_gmPauNRu";

const client = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("authForm");
const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const submitBtn = document.getElementById("submitBtn");
const messageBox = document.getElementById("message");
const nameField = document.getElementById("nameField");
const forgot = document.getElementById("forgot");

let mode = "login";

function showMessage(text, error = false) {
  messageBox.textContent = text;
  messageBox.className = "message" + (error ? " error" : "");
  messageBox.style.display = "block";
}

function clearMessage() {
  messageBox.style.display = "none";
}

function setMode(nextMode) {
  mode = nextMode;
  clearMessage();

  loginTab.classList.toggle("active", mode === "login");
  registerTab.classList.toggle("active", mode === "register");

  nameField.classList.toggle("hidden", mode !== "register");
  forgot.style.display = mode === "login" ? "block" : "none";

  document.getElementById("fullName").required =
    mode === "register";

  document.getElementById("password").autocomplete =
    mode === "login" ? "current-password" : "new-password";

  submitBtn.textContent =
    mode === "login" ? "Login to VRPAIData AI" : "Create Account";
}

loginTab.addEventListener("click", () => setMode("login"));
registerTab.addEventListener("click", () => setMode("register"));

const chatUrl = new URL("chat.html", window.location.href).href;
const loginUrl = window.location.origin + window.location.pathname;

async function handleAuthRedirect() {
  const params = new URLSearchParams(window.location.search);

  if (params.get("error")) {
    showMessage(
      params.get("error_description") || "Authentication failed.",
      true
    );
    return;
  }

  const { data } = await client.auth.getSession();

  if (data.session) {
    if (window.location.hash.includes("type=recovery")) {
      showMessage("Enter your new password below.");
      submitBtn.textContent = "Update Password";
      mode = "recovery";
      forgot.style.display = "none";
      loginTab.disabled = true;
      registerTab.disabled = true;
      return;
    }

    window.location.replace(chatUrl);
    return;
  }

  if (window.location.hash.includes("type=recovery")) {
    showMessage("Password recovery session could not be verified.", true);
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  clearMessage();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const fullName = document.getElementById("fullName").value.trim();

  submitBtn.disabled = true;

  try {
    if (mode === "recovery") {
      const { error } = await client.auth.updateUser({ password });

      if (error) throw error;

      showMessage("Password updated successfully. Please login.");
      mode = "login";
      setMode("login");
      return;
    }

    if (mode === "register") {
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName },
          emailRedirectTo: chatUrl
        }
      });

      if (error) throw error;

      if (data.session) {
        window.location.replace(chatUrl);
      } else {
        showMessage("Registration successful! Check your email to verify your account.");
      }

      return;
    }

    const { data, error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    if (data.session) {
      window.location.replace(chatUrl);
    }

  } catch (error) {
    showMessage(error.message || "Something went wrong.", true);
  } finally {
    submitBtn.disabled = false;
  }
});

forgot.addEventListener("click", async () => {
  clearMessage();

  const email = document.getElementById("email").value.trim();

  if (!email) {
    showMessage("Enter your email address first.", true);
    return;
  }

  try {
    const { error } = await client.auth.resetPasswordForEmail(email, {
      redirectTo: loginUrl
    });

    if (error) throw error;

    showMessage("If the account exists, a password reset email has been sent.");
  } catch (error) {
    showMessage(error.message, true);
  }
});

handleAuthRedirect();
</script>

</body>
</html>
